<!doctype html>
<html>
<head>
<!-- Loaded by the Claude Design viewer inside claude.ai; added so the preview also runs on its own (GitHub Pages). -->
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="../bundle.js"></script>
<meta charset="utf-8"><title>Aleem Design System — cover</title>
<style>
  html, body { margin: 0; }
  body { background: var(--surface-page); }
  .cover { position: relative; width: 960px; height: 288px; overflow: hidden; background: var(--surface-page); }
  .cover svg { position: absolute; inset: 0; display: block; }
  .ink { fill: var(--navy-800); }
  [data-theme="dark"] .ink { fill: var(--navy-700); }
  .blue { fill: var(--blue-500); }
  .cyan { fill: var(--cyan-500); }
  .tint { fill: var(--blue-100); }
  .ground { fill: var(--surface-page); }
  .slab { rx: var(--radius-2xl); }
  .tile { rx: var(--radius-xl); }
  .text { position: absolute; left: var(--space-10); bottom: var(--space-8); display: grid; gap: var(--space-2); }
  .name { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 64px; line-height: 0.95; letter-spacing: var(--tracking-tighter); color: var(--text-strong); white-space: nowrap; }
  .tagline { margin: 0; max-width: 440px; font-family: var(--font-sans); font-size: 13px; line-height: 1.5; color: var(--text-muted); white-space: nowrap; }
</style>
</head>
<body>
<div class="cover">
  <svg viewBox="0 0 960 288" width="960" height="288" aria-hidden="true">
    <!--
      blocks: navy-800 slab (navy-700 in dark, so it holds off the navy-900 ground), 304×112 and bleed 120×112, blue-500 208×112, cyan-500 112×112, blue-100 144×112; y = space-6, gaps space-4.
      arrangement: top-band skeleton (the 19-letter name is too wide for the 440px zone), a bento strip of unequal tiles bleeding off the right edge.
      pattern: pills, 14 units: "Corners. Soft and generous everywhere… buttons and chips are fully pill-shaped", stacked like the chat thread the brand leads with.
      scales: radius-2xl (slabs), radius-xl (tiles), pills 16 tall at rx 8 (half the short side); steps space-4, space-6, space-8, space-10.
    -->
    <rect class="ink slab" x="40" y="24" width="304" height="112" rx="32"/>
    <rect class="blue slab" x="360" y="24" width="208" height="112" rx="32"/>
    <rect class="cyan tile" x="584" y="24" width="112" height="112" rx="24"/>
    <rect class="tint tile" x="712" y="24" width="144" height="112" rx="24"/>
    <rect class="ink slab" x="872" y="24" width="120" height="112" rx="32"/>

    <rect class="cyan" x="72" y="48" width="160" height="16" rx="8"/>
    <rect class="ground" x="72" y="72" width="112" height="16" rx="8"/>
    <rect class="blue" x="184" y="96" width="128" height="16" rx="8"/>

    <rect class="ground" x="384" y="48" width="96" height="16" rx="8"/>
    <rect class="ground" x="384" y="72" width="144" height="16" rx="8"/>
    <rect class="tint" x="384" y="96" width="72" height="16" rx="8"/>
    <rect class="tint" x="464" y="96" width="80" height="16" rx="8"/>

    <rect class="ink" x="608" y="48" width="64" height="16" rx="8"/>
    <rect class="ink" x="608" y="72" width="40" height="16" rx="8"/>

    <rect class="blue" x="736" y="48" width="96" height="16" rx="8"/>
    <rect class="ink" x="736" y="72" width="64" height="16" rx="8"/>
    <rect class="cyan" x="736" y="96" width="80" height="16" rx="8"/>

    <rect class="cyan" x="896" y="48" width="96" height="16" rx="8"/>
    <rect class="blue" x="896" y="72" width="64" height="16" rx="8"/>
  </svg>
  <div class="text">
    <p class="name">Aleem Design System</p>
    <p class="tagline">Aleem | AIUX: designing AI products people can trust.</p>
  </div>
</div>
</body>
</html>
