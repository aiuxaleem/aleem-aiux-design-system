<!doctype html>
<html>
<head><meta charset="utf-8"><title>Icon — preview</title>
<style>
  body { margin: 0; padding: 20px; background: var(--surface-page); }
  .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  .stack { display: grid; gap: 12px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); gap: 16px; align-items: start; }
  .label { font-family: var(--font-mono); font-size: var(--text-micro); letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-subtle); margin: 0 0 8px; }
  .tile { width: 48px; height: 48px; border-radius: var(--radius-md); display: inline-flex; align-items: center; justify-content: center; }
  .set { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
  .cell { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 4px; border-radius: var(--radius-sm); background: var(--surface-card); border: 1px solid var(--border-subtle); color: var(--text-strong); }
  .cell span { font-family: var(--font-mono); font-size: var(--text-micro); color: var(--text-muted); text-align: center; overflow-wrap: anywhere; }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var D = window.AleemDesignSystem_3de1ed, h = React.createElement, F = React.Fragment;
  function Demo() {
    var names = D.ICON_NAMES || [];
    return h('div', { className: 'stack', style: { gap: 20 } },
      h('div', { className: 'row' },
        h('span', { className: 'tile', style: { background: 'var(--blue-100)', color: 'var(--blue-600)' } }, h(D.Icon, { name: 'phone-incoming', size: 24 })),
        h('span', { className: 'tile', style: { background: 'var(--gradient-brand-deep-135)', color: 'var(--text-on-brand)' } }, h(D.Icon, { name: 'calendar-check', size: 24 })),
        h('span', { className: 'tile', style: { background: 'var(--surface-ink)', color: 'var(--on-ink-link)' } }, h(D.Icon, { name: 'sparkles', size: 24 })),
        h(D.Button, { variant: 'secondary', size: 'sm', iconStart: h(D.Icon, { name: 'download', size: 16, duotone: false, strokeWidth: 2 }) }, 'Export CSV'),
        h(D.Button, { size: 'sm', iconEnd: h(D.Icon, { name: 'arrow-right', size: 16, duotone: false, strokeWidth: 2 }) }, 'Book a demo')),
      h('div', null, h('p', { className: 'label' }, 'The set \u00b7 ' + names.length + ' glyphs'),
        h('div', { className: 'set' }, names.map(function (n) { return h('div', { className: 'cell', key: n }, h(D.Icon, { name: n, size: 24 }), h('span', null, n)); }))));
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
