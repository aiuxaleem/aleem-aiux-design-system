<!doctype html>

<style>

  .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  .stack { display: grid; gap: 12px; }

<body>
<div id="root"></div>
<script>
  var D = window.AleemDesignSystem_3de1ed, h = React.createElement, F = React.Fragment;

  function Demo() {
    return h('div', { className: 'grid wide' },
      h(D.PromptInput, { id: 'p1', suggestions: ['What did you ship last year?', 'How do you design for trust?', 'Show me a design system case'] }),
      h('div', { className: 'stack' },
        h(D.PromptInput, { id: 'p2', defaultValue: 'Walk me through the freight design system', busy: true }),
        h(D.PromptInput, { id: 'p3', maxLength: 80, defaultValue: 'I am hiring a lead designer for an AI agent product. What would your first 90 days look like?' })));
