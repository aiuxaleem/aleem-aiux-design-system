<!doctype html>
<html>
<head><meta charset="utf-8"><title>Alert — preview</title>
<style>
  body { margin: 0; padding: 20px; background: var(--surface-page); font-family: var(--font-sans); }
  .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  .stack { display: grid; gap: 12px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: 16px; align-items: start; }
  .label { font-family: var(--font-mono); font-size: var(--text-micro); letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-subtle); margin: 0 0 8px; }
  .note { margin: 12px 0 0; font-size: var(--text-micro); color: var(--text-subtle); }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var D = window.AleemDesignSystem_3de1ed, h = React.createElement, F = React.Fragment;

  function Demo() {
    return h('div', { className: 'stack' },
      h(D.Alert, { tone: 'info', title: 'This answer is AI-generated', compact: true }, 'It is based on my case studies. Check the sources before you quote it.'),
      h(D.Alert, { tone: 'success', title: 'Call booked', compact: true }, 'Thursday at 3:00 PM IST. The invite is in your inbox.'),
      h(D.Alert, { tone: 'warning', title: 'The CV download is from March', compact: true, action: h(D.Button, { size: 'sm', variant: 'secondary' }, 'Request the latest') }),
      h(D.Alert, { tone: 'danger', title: "Your message didn't send", compact: true, onDismiss: function () {} }, 'Check your connection and try again. Nothing you typed was lost.'));
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
