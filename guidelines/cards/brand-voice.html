<!-- @dsCard group="Brand" viewport="700x170" name="Voice & Stat Treatment" subtitle="Aleem writes in first person, proof first; real numbers lead" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; padding: 24px; background: var(--surface-card); display: flex; flex-wrap: wrap; gap: 20px 28px; align-items: center; }
  .voice { flex: 1 1 260px; min-width: 0; }
  .pill { margin-bottom: 12px; }
  .quote { font-family: var(--font-display); font-weight: 700; font-size: 22px; color: var(--text-strong); letter-spacing: -0.018em; line-height: 1.3; text-wrap: balance; }
  .stats { display: flex; flex-wrap: wrap; gap: 14px 24px; }
  .stat .num { font-family: var(--font-display); font-weight: 800; font-size: 40px; letter-spacing: -0.03em; line-height: 1; color: var(--text-strong); }
  .stat .num.g { background: var(--gradient-brand-text); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .stat .lbl { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
</style>
</head>
<body>
  <div class="voice">
    <span class="cory-eyebrow-pill pill">Lead AI Product Designer</span>
    <div class="quote">"AI is fast. Trust is slow. I design the gap."</div>
  </div>
  <div class="stats">
    <div class="stat"><div class="num g">13+</div><div class="lbl">Years designing products</div></div>
    <div class="stat"><div class="num">5</div><div class="lbl">Brands on one component library</div></div>
  </div>
</body>
</html>
