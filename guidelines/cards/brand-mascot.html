<!-- @dsCard group="Brand" viewport="700x200" name="Marks & Avatars" subtitle="AIUX mark for Aleem; Cory tiles belong to the admissions case study" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; padding: 24px 28px; background: var(--surface-card); display: flex; flex-wrap: wrap; gap: 20px 28px; align-items: flex-end; font-family: var(--font-sans); }
  .grp { display: flex; flex-direction: column; gap: 12px; }
  .grp + .grp { padding-inline-start: 28px; border-inline-start: 1px solid var(--border-subtle); }
  .h { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-muted); }
  .row { display: flex; gap: 18px; align-items: flex-end; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .lbl { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); }
  .tile { width: 72px; height: 72px; border-radius: var(--radius-tile); display: block; box-shadow: 0 0 0 1px var(--border-subtle); }
  img { display: block; }
</style>
</head>
<body>
  <div class="grp">
    <span class="h">Aleem | AIUX</span>
    <div class="row">
      <div class="item"><img class="tile" src="../../assets/Logo/aleem-mark.svg" alt="AIUX mark"><div class="lbl">mark</div></div>
      <div class="item"><img class="tile" src="../../assets/Logo/aleem-mark.svg" style="width:40px;height:40px" alt=""><div class="lbl">avatar 40</div></div>
      <div class="item"><img class="tile" src="../../assets/Logo/aleem-mark.svg" style="width:28px;height:28px" alt=""><div class="lbl">28</div></div>
    </div>
  </div>
  <div class="grp">
    <span class="h">Case study: Cory</span>
    <div class="row">
      <div class="item"><img class="tile" src="../../assets/cory-tile.svg" alt="Cory tile light"><div class="lbl">tile · light</div></div>
      <div class="item"><img class="tile" src="../../assets/cory-tile-dark.svg" alt="Cory tile dark"><div class="lbl">tile · dark</div></div>
      <div class="item"><img class="tile" src="../../assets/cory-tile.svg" style="width:40px;height:40px" alt=""><div class="lbl">avatar 40</div></div>
    </div>
  </div>
</body>
</html>
