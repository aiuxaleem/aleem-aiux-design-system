<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LinkedIn profile cover, Md Abdul Aleem</title>
<meta name="description" content="1584x396 LinkedIn profile banner for Md Abdul Aleem: Designing the frontier with AI.">
<!-- Styles load from the markup, not from script, so the first paint is already styled (no flash, no layout shift) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://unpkg.com" crossorigin>
<link rel="stylesheet" href="../../styles.css">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="LinkedIn Profile Cover" description="1584x396 LinkedIn profile banner: headline staircase, brand-gradient band with an ink arrow, tilted tool tiles (Figma, Claude, ChatGPT, Gemini) and the author credit; dark or light" -->
<helmet><script src="./ds-base.js"></script><style>.fit-canvas{transform-origin:top left}[dir="rtl"] .fit-canvas{transform-origin:top right}body{margin:0;background:var(--surface-sunken)}a{color:var(--text-link);text-decoration:none}a:hover{color:var(--text-link-hover)}</style></helmet>
<button onClick="{{ download }}" class="cory-nowrap" style="position:fixed;inset-inline-end:24px;bottom:24px;z-index:50;display:flex;align-items:center;gap:10px;min-height:44px;padding:12px 22px;border:0;border-radius:999px;background:var(--text-strong);color:var(--surface-page);font-family:'Plus Jakarta Sans',system-ui,sans-serif;font-size:15px;font-weight:700;white-space:nowrap;cursor:pointer;box-shadow:0 10px 28px rgba(11,31,54,.25)">{{ dlLabel }}</button>
<sc-if value="{{ hasError }}" hint-placeholder-val="{{ false }}"><p role="alert" style="position:fixed;inset-inline-end:24px;bottom:84px;z-index:50;margin:0;max-width:320px;padding:10px 14px;border-radius:12px;background:var(--surface-danger);border:1px solid var(--border-danger);font-family:'Plus Jakarta Sans',system-ui,sans-serif;font-size:13px;line-height:1.4;color:var(--text-danger);text-wrap:pretty">Could not export: {{ errorText }}. Check the connection and tap the button again.</p></sc-if>
<div class="fit-box" style="width:calc(1584px * var(--fit, 1));height:calc(396px * var(--fit, 1));margin-inline:auto"><div class="fit-canvas" data-fit-canvas style="width:1584px;height:396px;transform:scale(var(--fit, 1))"><div ref="{{ canvasRef }}" data-theme="{{ theme }}" data-screen-label="LinkedIn profile cover" style="position:relative;width:1584px;height:396px;box-sizing:border-box;overflow:hidden;background:var(--surface-page);color:var(--text-strong);font-family:'Plus Jakarta Sans',system-ui,sans-serif">
<sc-if value="{{ showGlow }}" hint-placeholder-val="{{ true }}">
<div aria-hidden="true" style="position:absolute;inset-inline-end:-140px;top:-280px;width:720px;height:720px;border-radius:50%;background:var(--glow-cyan);pointer-events:none"></div>
<div aria-hidden="true" style="position:absolute;inset-inline-start:-220px;bottom:-340px;width:600px;height:600px;border-radius:50%;background:var(--glow-blue);pointer-events:none"></div>
</sc-if>
<sc-if value="{{ showMark }}" hint-placeholder-val="{{ true }}">
<span style="position:absolute;top:36px;inset-inline-end:84px;width:52px;height:52px;border-radius:16px;background:#FFFFFF;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px rgba(4,12,22,.22)"><img data-icon="brain-circuit" data-color="#1568D4" alt="AI" style="width:32px;height:32px;display:block"></span>
</sc-if>
<div style="position:absolute;top:45px;inset-inline-end:152px;display:flex;gap:10px">
<span class="cory-nowrap" style="padding:8px 14px;border-radius:999px;border:1px solid var(--border-interactive);font-size:14px;line-height:1.2;font-weight:700;color:var(--text-strong);white-space:nowrap">Design systems</span>
<span class="cory-nowrap" style="padding:8px 14px;border-radius:999px;border:1px solid var(--border-interactive);font-size:14px;line-height:1.2;font-weight:700;color:var(--text-strong);white-space:nowrap">AI agents</span>
<span class="cory-nowrap" style="padding:8px 14px;border-radius:999px;border:1px solid var(--border-interactive);font-size:14px;line-height:1.2;font-weight:700;color:var(--text-strong);white-space:nowrap">Figma to code</span>
</div>
<h1 style="position:absolute;inset:0;margin:0;font-size:96px;line-height:1;font-weight:800;letter-spacing:-.04em;color:var(--text-strong)">
<span style="position:absolute;top:36px;inset-inline-start:72px;display:block">Designing</span>
<span aria-hidden="true" style="position:absolute;top:112px;inset-inline-start:1400px;width:100px;height:180px;display:block;background:linear-gradient(90deg,#29BADE,#29BEDD);clip-path:polygon(0 0,100% 50%,0 100%);transform:scaleX(var(--dir, 1))"></span>
<span style="position:absolute;top:150px;inset-inline-start:0;inset-inline-end:184px;height:104px;box-sizing:border-box;display:flex;align-items:center;gap:28px;background:linear-gradient(90deg,#258AFD 0px,#29BEDD 1500px)">
<span aria-hidden="true" style="flex:none;width:452px;height:28px;display:block;background:var(--surface-ink)"></span>
<span style="flex:none;display:block;font-size:76px;line-height:1;letter-spacing:-.035em;color:var(--surface-ink)">the frontier</span>
<span aria-hidden="true" style="flex:1;min-width:0;height:28px;margin-inline-end:-4px;display:block;background:var(--surface-ink)"></span>
</span>
<span aria-hidden="true" style="position:absolute;top:172px;inset-inline-start:1398px;width:44px;height:60px;display:block;background:var(--surface-ink);clip-path:polygon(0 0,100% 50%,0 100%);transform:scaleX(var(--dir, 1))"></span>
<span style="position:absolute;top:278px;inset-inline-start:480px;display:block">with AI</span>
</h1>
<span style="position:absolute;top:142px;inset-inline-start:980px;width:100px;height:100px;border-radius:26px;background:#FFFFFF;display:flex;align-items:center;justify-content:center;transform:rotate(-7deg);box-shadow:0 14px 30px rgba(4,12,22,.32)"><img data-brand="figma" data-color="#0B1F36" alt="Figma" style="width:46px;height:46px;display:block"></span>
<span style="position:absolute;top:142px;inset-inline-start:1072px;width:100px;height:100px;border-radius:26px;background:#D97757;display:flex;align-items:center;justify-content:center;transform:rotate(5deg);box-shadow:0 14px 30px rgba(4,12,22,.32)"><img data-brand="claude" data-color="#FFFFFF" alt="Claude" style="width:48px;height:48px;display:block"></span>
<span style="position:absolute;top:142px;inset-inline-start:1164px;width:100px;height:100px;border-radius:26px;background:#10A37F;display:flex;align-items:center;justify-content:center;transform:rotate(-4deg);box-shadow:0 14px 30px rgba(4,12,22,.32)"><img data-brand="openai" data-color="#FFFFFF" alt="ChatGPT" style="width:50px;height:50px;display:block"></span>
<span style="position:absolute;top:142px;inset-inline-start:1256px;width:100px;height:100px;border-radius:26px;background:linear-gradient(135deg,#4285F4 0%,#9B72CB 55%,#D96570 100%);display:flex;align-items:center;justify-content:center;transform:rotate(6deg);box-shadow:0 14px 30px rgba(4,12,22,.32)"><img data-brand="googlegemini" data-color="#FFFFFF" alt="Gemini" style="width:50px;height:50px;display:block"></span>
<div style="position:absolute;bottom:30px;inset-inline-end:84px;display:flex;align-items:center;gap:14px;min-width:0">
<img src="./author-avatar.png" alt="Md Abdul Aleem" width="48" height="48" style="width:48px;height:48px;border-radius:50%;object-fit:cover;flex:none">
<div style="display:flex;flex-direction:column;gap:2px;min-width:0;max-width:520px"><span style="font-size:20px;line-height:1.2;font-weight:800;letter-spacing:-.02em;color:var(--text-strong)">Md Abdul Aleem</span><span style="font-size:15px;line-height:1.35;font-weight:600;color:var(--text-muted);text-wrap:pretty">Lead Product Designer &amp; Frontier AI Analyst @Colaberry Ex-NTTDATA</span></div>
</div>
</div></div></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1584,&quot;height&quot;:396},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;dark&quot;,&quot;options&quot;:[&quot;dark&quot;,&quot;light&quot;],&quot;tsType&quot;:&quot;'dark' | 'light'&quot;,&quot;section&quot;:&quot;Theme&quot;},&quot;showGlow&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Background&quot;},&quot;showMark&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Layout&quot;}}">
class Component extends DCLogic {
  state = { busy: false, error: '' };
  canvasRef = React.createRef();
  icons = {};
  loads = [];
  fileName = 'aleem-linkedin-cover.png';
  withTimeout(p, ms, label) { return Promise.race([p, new Promise((_, r) => setTimeout(() => r(new Error(label + ' timed out')), ms))]); }
  fetchText(urls, ms) {
    const tryOne = (i) => {
      if (i >= urls.length) return Promise.reject(new Error('all sources failed'));
      const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), ms);
      return fetch(urls[i], { signal: ctl.signal }).then(r => { if (!r.ok) throw new Error(String(r.status)); return r.text(); }).finally(() => clearTimeout(t)).catch(() => tryOne(i + 1));
    };
    return tryOne(0);
  }
  ensureLib() {
    if (window.coryEnsureHtmlToImage) return window.coryEnsureHtmlToImage();
    if (window.htmlToImage) return Promise.resolve();
    return Promise.reject(new Error('image library could not be loaded, check your connection'));
  }
  keyOf(img) { return (img.dataset.icon ? 'l:' + img.dataset.icon : 'b:' + img.dataset.brand) + '|' + img.dataset.color; }
  applyIcons() {
    const root = this.canvasRef.current; if (!root) return;
    root.querySelectorAll('img[data-icon],img[data-brand]').forEach(img => {
      const u = this.icons[this.keyOf(img)];
      if (u && img.src !== u) img.src = u;
    });
  }
  componentDidMount() {
    const root = this.canvasRef.current; if (!root) return;
    const keys = new Set([...root.querySelectorAll('img[data-icon],img[data-brand]')].map(i => this.keyOf(i)));
    this.loads = [...keys].map(k => {
      const [id, c] = k.split('|');
      const lucide = id.startsWith('l:'), n = id.slice(2);
      const pkg = lucide ? 'lucide-static@0.469.0' : 'simple-icons@15.0.0';
      const urls = ['https://cdn.jsdelivr.net/npm/' + pkg + '/icons/' + n + '.svg', 'https://unpkg.com/' + pkg + '/icons/' + n + '.svg'];
      return this.fetchText(urls, 8000).then(t => {
        const svg = lucide ? t.replace(/currentColor/g, c) : t.replace('<svg ', '<svg fill="' + c + '" ');
        this.icons[k] = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
        this.applyIcons();
      }).catch(() => console.warn('icon missing: ' + n));
    });
  }
  componentDidUpdate() { this.applyIcons(); }
  download = async () => {
    const node = this.canvasRef.current;
    if (!node || this.state.busy) return;
    this.setState({ busy: true, error: '' });
    try {
      await this.ensureLib();
      await this.withTimeout(document.fonts.ready, 8000, 'fonts').catch(() => {});
      await this.withTimeout(Promise.all(this.loads), 8000, 'icons').catch(() => {});
      this.applyIcons();
      await Promise.all([...node.querySelectorAll('img')].map(i => i.src ? i.decode().catch(() => {}) : null));
      const dataUrl = await this.withTimeout(window.htmlToImage.toPng(node, { pixelRatio: 2, width: 1584, height: 396 }), 60000, 'render');
      await (window.coryExportPng ? window.coryExportPng(dataUrl, this.fileName) : Promise.reject(new Error('export helper not loaded')));
      this.setState({ busy: false });
    } catch (e) {
      console.error('PNG export failed', e);
      if (window.coryExportFailed) window.coryExportFailed(e);
      this.setState({ busy: false, error: (e && e.message) || 'export failed' });
    }
  };
  renderVals() {
    const p = this.props, s = this.state;
    return { canvasRef: this.canvasRef, download: this.download, hasError: !!s.error, errorText: s.error, dlLabel: s.busy ? 'Exporting…' : s.error ? 'Export failed, retry' : 'Download PNG ↓', theme: p.theme ?? 'dark', showGlow: p.showGlow ?? true, showMark: p.showMark ?? true };
  }
}
</script>
</body>
</html>
